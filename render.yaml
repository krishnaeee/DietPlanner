# Render Blueprint — deploy with: dashboard.render.com → New + → Blueprint
# (point it at this repo; Render reads this file from the repo root).
#
# FREE TIER: no persistent disk, but data lives in Neon Postgres (external), so
# accounts now survive deploys and restarts. One remaining limit:
#   • Cold starts — the service sleeps after ~15 min idle; the first request
#     after that takes ~30-50s to wake.

services:
  - type: web
    name: diet-planner-backend
    runtime: node
    rootDir: backend            # server.js lives in backend/, not repo root
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: PROVIDER
        value: gemini
      # Secrets: sync:false keeps them OUT of git — set the values in the
      # Render dashboard (Environment tab) after the first deploy.
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      # Neon Postgres connection string (use the POOLED one). Paste it in the
      # Render dashboard → Environment. Persists user accounts across deploys.
      - key: DATABASE_URL
        sync: false
      # PORT is injected by Render automatically — do not set it here.
